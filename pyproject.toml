[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ksp-java"
version = "0.0.0"
description = "Easy way to bundle java files in python packages"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "hatchling",
]

[tool.hatch.build.targets.wheel]
packages = ["ksp_java"]
